app = "cyclonex-backend"
primary_region = "sin"          # Singapore — closest to India

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  DATABASE_URL    = "sqlite+aiosqlite:///./cyclonex.db"
  FRONTEND_URL    = "https://cyclonex-iota.vercel.app"
  DEBUG           = "false"
  DATA_SOURCE     = "synthetic"
  PORT            = "8080"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = true
  auto_start_machines  = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "10s"
    interval     = "30s"
    method       = "GET"
    path         = "/api/v1/health"
    port         = 8080
    timeout      = "10s"
    type         = "http"
